[workspace]
resolver = "3"
members = ["kernel", "libs/zirvstdlib"]

[workspace.package]
version = "2.0.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Gautham Nair"]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
