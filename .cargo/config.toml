[build]
target = "x86_64-unknown-uefi"

[target.x86_64-unknown-uefi]
# The Rust UEFI target only enables `fxsr`, which makes the compiler lower every
# scalar float operation to a compiler-rt soft-float call. Enable SSE/SSE2
# hardware float to get orders-of-magnitude better rendering performance.
# `-soft-float` explicitly disables the soft float ABI/lowering.
rustflags = [
    "-C",
    "target-feature=+sse,+sse2,+fxsr,-soft-float",
    "-C",
    "link-arg=/STACK:2097152",
]
